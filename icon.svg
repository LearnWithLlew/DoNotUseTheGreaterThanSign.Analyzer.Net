<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Do not use the greater than sign</title>
  <rect width="256" height="256" rx="48" fill="#1f2430"/>
  <!-- banned: greater-than sign with a slash through it -->
  <polyline points="48,64 100,108 48,152" fill="none" stroke="#8b93a7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="88" y1="44" x2="62" y2="172" stroke="#ff5a5f" stroke-width="12" stroke-linecap="round"/>
  <!-- replacement: less-than sign -->
  <polyline points="208,64 156,108 208,152" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- fix: curved arrow from the banned sign to its replacement -->
  <path d="M76 190 Q128 236 157 208" fill="none" stroke="#f5a623" stroke-width="12" stroke-linecap="round"/>
  <polygon points="176,190 166,216 148,196" fill="#f5a623" stroke="#f5a623" stroke-width="4" stroke-linejoin="round"/>
</svg>
